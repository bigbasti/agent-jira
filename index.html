<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>agent-jira</title>
    <!--
      The two colours below are --canvas from src/web/styles/tokens.css, duplicated because
      they have to paint before the bundle loads. Change them together.
    -->
    <style>
      html {
        background-color: #0b0c0f;
      }
      html[data-theme='light'] {
        background-color: #eceef3;
      }
    </style>
    <script>
      // Resolve the theme before first paint so the canvas never flashes the wrong one.
      (function () {
        try {
          var stored = localStorage.getItem('agent-jira:theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = theme;
        } catch (err) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
